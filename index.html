<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى نغم الغالية 🫂</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .heart-particle {
            position: absolute;
            color: rgba(212, 175, 55, 0.3);
            font-size: 14px;
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .login-box {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 380px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }
        .login-box h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            padding-left: 40px; 
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            text-align: center;
        }
        .clear-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }
        .login-box button.submit-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            font-weight: bold;
            background-color: #fdf2f2;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #fde8e8;
        }
        #protected-content {
            display: none;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 6px solid #d4af37;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 26px;
            color: #1a252f;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .timer-box {
            background: rgba(248, 249, 250, 0.9);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }
        .timer-title {
            font-size: 12px;
            color: #95a5a6;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: #d4af37;
            direction: ltr;
            display: inline-block;
        }
        .card {
            background-color: #ffffff;
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px dashed #e2e8f0;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quote-text {
            font-size: 16px;
            font-style: italic;
            line-height: 1.7;
            color: #4a5568;
            font-weight: 500;
        }
        .footer-note {
            font-size: 11px;
            color: #a0aec0;
            margin-top: 15px;
        }
    </style>

    <script>
        function clearInput() {
            document.getElementById("pass-input").value = "";
            document.getElementById("error").style.display = "none";
        }

        function sendNotification() {
            fetch("https://formspree.io", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "نغم قامت بفتح الموقع الآن ❤️‍🩹" })
            }).catch(err => console.log("Done"));
        }

        function checkPassword() {
            const userInput = document.getElementById("pass-input").value;
            const correctPassword = "يوم السبت 8/8/2026"; 

            if (userInput.trim() === correctPassword) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
                sendNotification(); 
                initSite(); 
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        function initSite() {
            const yearlyQuotes = [
                "الوعود الصادقة لا تموت بالمسافات، بل تحيا بالدعاء واليقين بيوم اللقاء الطيب.",
                "كل خطوة صعبة أخطوها اليوم هي لأجل بناء بيتٍ يجمعنا بالحلال يوماً ما.",
                "لستِ وحدكِ في تلك البلاد البعيدة، قلبي ودعائي يحيطان بكِ في كل لحظة.",
                "خمس سنوات أو أكثر لن تغير قلباً عرف وجهته، وأنتِ كنتِ دائماً الوجهة والهدف.",
                "الترك لله عوضه مبهر، وأنا تركت المتاح حباً في الحلال الذي يرضاه الله لنا.",
                "أرى في صبري وصبركِ جهاداً جميلاً، سنقطف ثمرته يوماً ونحن في بيت واحد.",
                "نغم.. اسمكِ ليس مجرد حروف، بل هو الأمل المضيء وسط عتمة الأيام.",
                "البعد يختبر صدق المشاعر، وفي كل يوم يمر، أجدني أحبكِ بشكل أعمق وأصدق.",
                "قد نكون تحت سماءين مختلفتين، لكننا ننظر إلى نفس القمر ونحمل نفس النوايا.",
                "أنتِ لستِ عابرة في حياتي, أنتِ البداية والنهاية وكل الأمنيات الطيبة.",
                "بيني وبينكِ عهدٌ كتبناه بصدق النية، ولن تكسره مسافات الأرض ولا بعد القارات.",
                "وجودكِ في خيالي يمنحني القوة لأحارب من أجل مستقبلنا كل يوم.",
                "أعلم أن الغربة في ألمانيا باردة وصعبة، لكن دفء حلمنا كفيل بأن يذيب كل الجليد.",
                "كوني قوية يا نغم، واجهي مصاعب الدراسة والغربة، فأنا أنتظر نجاحكِ بفخر كبير.",
                "كلما شعرتِ بالوحدة هناك، تذكري أن هناك قلباً في المشرق ينبض بالدعاء لكِ.",
                "تحدي الصعاب اليوم لتصنعي مستقبلكِ، فالمستقبل أجمل بكثير مما تتخيلين.",
                "أتمنى لكِ يوماً مليئاً بالتوفيق في دراستكِ وعملكِ، كوني فخورة بنفسكِ دائماً.",
                "الغربة تصنع منّا أشخاصاً أقوى، وأنا واثق أن نغم قادرة على تحقيق كل طموحاتها.",
                "الأيام تمضي، وما يبدو بعيداً اليوم، سيكون بالصبر والدعاء قريباً جداً.",
                "القصص الأجمل هي تلك التي تبدأ بالتضحية والصبر، وتنتهي بما يقر العين ويشرح الصدر.",
                "كلما مرّ يوم، تذكري أننا اقتربنا خطوة إضافية نحو نهاية هذا الطريق الطويل.",
                "الصبر مرّ، لكن عاقبته حلوة كحلاوة الاستجابة ويوم يجمع الله شملنا بالحلال.",
                "عاهدت نفسي أن أكون السند الذي لا يميل، حتى نلتقي وتستقر الأماني في مكانها.",
                "حمايتنا لهذا الحب بالابتعاد المؤقت هو أصدق دليل على أننا نريد بركة الله معنا.",
                "ابتسمي يا نغم، فابتسامتكِ هي الطاقة التي تدفعني لأتحمل مشاق الأيام هنا.",
                "لا تقيسي المسافة بالكيلومترات، قيسيها بالدعوات الصادقة التي تصعد للسماء في نفس الوقت.",
                "مهما بلغت برودة الشتاء في ألمانيا، تذكري أن لكِ في بلادكِ وطناً كاملاً ينتظركِ.",
                "القلوب العفيفة يجمعها الله برحمته ولو كانت بينها جبال وبحار.",
                "أنتِ المكافأة التي أدعو الله بها في نهاية هذا الصبر والجهد الطويل.",
                "كل نجاح تحققينه هناك هو خطوة في بناء مستقبلنا المشترك، فاستمري بكل قوة.",
                "نهاية الطرق الصعبة دائماً تكون بساتين مزهرة، وعهدنا سيزهر بالحلال يوماً ما."
            ];

            function displayDailyQuote() {
                const today = new Date();
                const start = new Date(today.getFullYear(), 0, 0);
                const diff = today - start;
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor(diff / oneDay);
                
                const quoteIndex = (dayOfYear - 1) % yearlyQuotes.length;
                document.getElementById('daily-quote').innerText = `"${yearlyQuotes[quoteIndex]}"`;
            }

            const startDate = new Date(2026, 7, 8, 0, 0, 0); 

            function updateTimer() {
                const now = new Date();
                const difference = now - startDate;
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
